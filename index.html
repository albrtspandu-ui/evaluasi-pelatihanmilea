<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Report Evaluasi Pembelajaran MILEA – MDS Retailing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* =========================================================
   KONFIGURASI WARNA UI (bukan warna report – report selalu putih)
   ========================================================= */
:root{
  color-scheme: light;
  --bg:#E9ECF2;
  --panel:#FFFFFF;
  --ink:#141A2B;
  --muted:#5B6478;
  --line:#D5DAE4;
  --navy:#0B2265;
  --navy-soft:#E3E8F5;
  --amber:#9A5B00;
  --amber-soft:#FDF1DC;
  --danger:#A3122A;
  --danger-soft:#FBE4E8;
  --ok:#156B3F;
  --ok-soft:#E1F3E8;
  --field:#F7F8FB;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#10131B; --panel:#1A1F2B; --ink:#E7EAF1; --muted:#9AA3B6; --line:#2E3546;
    --navy:#8FA8F0; --navy-soft:#1F2A47; --amber:#F2B862; --amber-soft:#3A2C14;
    --danger:#F28B9C; --danger-soft:#3D1A22; --ok:#7FD3A3; --ok-soft:#173326; --field:#141822;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#10131B; --panel:#1A1F2B; --ink:#E7EAF1; --muted:#9AA3B6; --line:#2E3546;
  --navy:#8FA8F0; --navy-soft:#1F2A47; --amber:#F2B862; --amber-soft:#3A2C14;
  --danger:#F28B9C; --danger-soft:#3D1A22; --ok:#7FD3A3; --ok-soft:#173326; --field:#141822;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  font-size:15px; line-height:1.5;
}
button,input,textarea{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--navy); outline-offset:2px; }

/* ---------- Header ---------- */
.app-head{
  display:flex; align-items:center; gap:18px; padding:18px 28px;
  border-bottom:1px solid var(--line); background:var(--panel);
}
.app-head h1{ margin:0; font-size:19px; font-weight:700; letter-spacing:-0.01em; }
.app-head p{ margin:0; color:var(--muted); font-size:13.5px; }

/* ---------- Layout ---------- */
.layout{
  display:grid; grid-template-columns:minmax(360px, 470px) 1fr; gap:28px;
  padding:28px; max-width:1500px; margin:0 auto; align-items:start;
}
@media (max-width: 980px){ .layout{ grid-template-columns:1fr; padding:16px; gap:20px; } }

.steps{ display:flex; flex-direction:column; gap:18px; min-width:0; }
.step{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px 22px 22px; }
.step-head{ display:flex; align-items:baseline; gap:12px; margin-bottom:14px; }
.step-num{
  flex:none; width:26px; height:26px; border-radius:50%; display:grid; place-items:center;
  background:var(--navy); color:var(--panel); font-size:13px; font-weight:700;
}
.step-head h2{ margin:0; font-size:16px; font-weight:700; }
.step-head .hint{ color:var(--muted); font-size:13px; margin-left:auto; }
.step.locked{ opacity:.55; }
.step.locked .step-body{ pointer-events:none; }

/* ---------- Upload ---------- */
.drop{
  display:block; border:1.5px dashed var(--line); border-radius:10px; padding:22px; text-align:center;
  cursor:pointer; background:var(--field); transition:border-color .15s, background .15s;
}
.drop:hover,.drop.drag{ border-color:var(--navy); background:var(--navy-soft); }
.drop strong{ display:block; font-size:15px; }
.drop span{ color:var(--muted); font-size:13px; }
.drop input{ position:absolute; width:1px; height:1px; opacity:0; }
.file-info{ margin-top:14px; font-size:13.5px; }
.file-info .fname{ font-weight:600; word-break:break-all; }
.stats{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.chip{ font-size:12.5px; padding:4px 10px; border-radius:999px; background:var(--navy-soft); color:var(--navy); font-weight:600; }
.chip.warn{ background:var(--amber-soft); color:var(--amber); }
.notice{ margin-top:10px; padding:10px 12px; border-radius:8px; font-size:13px; }
.notice.err{ background:var(--danger-soft); color:var(--danger); }
.notice.warn{ background:var(--amber-soft); color:var(--amber); }
.notice.ok{ background:var(--ok-soft); color:var(--ok); }

/* ---------- Fields ---------- */
.field{ display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
.field:last-child{ margin-bottom:0; }
.field label{ font-size:13px; font-weight:600; }
.field .sub{ font-size:12px; color:var(--muted); font-weight:400; }
.field input[type=text], .field textarea{
  width:100%; border:1px solid var(--line); background:var(--field); border-radius:8px; padding:9px 11px;
}
.field textarea{ resize:vertical; min-height:64px; overflow:hidden; line-height:1.45; font-size:14px; }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.date-row{ display:flex; gap:8px; }
.date-row input[type=text]{ flex:1; }
.date-row input[type=date]{
  flex:none; width:150px; border:1px solid var(--line); background:var(--field); border-radius:8px; padding:0 8px; cursor:pointer;
}

/* ---------- Summary editor ---------- */
.ai-bar{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:6px; }
.ai-status{ font-size:13px; color:var(--muted); }
.sum-group{ border-top:1px solid var(--line); padding-top:14px; margin-top:14px; }
.sum-group h3{ margin:0 0 10px; font-size:14.5px; font-weight:700; display:flex; align-items:baseline; gap:8px; }
.sum-group h3 .avg{ font-weight:600; color:var(--muted); font-size:13px; }
.field.improve label{ color:var(--amber); }
details.raw{ margin-top:4px; font-size:13px; }
details.raw summary{ cursor:pointer; color:var(--navy); font-weight:600; padding:4px 0; }
details.raw ul{ margin:6px 0 0; padding-left:18px; color:var(--muted); max-height:220px; overflow:auto; }
details.raw li{ margin-bottom:3px; }
details.raw .tools{ margin-top:6px; }
.sec-tools{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:2px 0 6px; }
.sec-status{ font-size:12.5px; color:var(--muted); }
.ai-mode{ margin:4px 0 0; font-size:12.5px; color:var(--muted); }

/* ---------- Buttons ---------- */
.btn{
  border:1px solid var(--navy); background:var(--navy); color:var(--panel); border-radius:9px;
  padding:9px 16px; font-weight:600; font-size:14px; cursor:pointer; display:inline-flex; align-items:center; gap:8px;
}
.btn:hover{ filter:brightness(1.08); }
.btn:disabled{ opacity:.5; cursor:not-allowed; filter:none; }
.btn.ghost{ background:transparent; color:var(--navy); }
.btn.small{ padding:5px 10px; font-size:12.5px; border-radius:7px; }
.spin{ width:14px; height:14px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:spin .7s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
@media (prefers-reduced-motion: reduce){ .spin{ animation-duration:2s; } }

/* ---------- Preview ---------- */
.preview-col{ position:sticky; top:16px; min-width:0; }
@media (max-width: 980px){ .preview-col{ position:static; } }
.preview-bar{ display:flex; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
.preview-bar .fit{ font-size:13px; color:var(--muted); }
.preview-bar .fit.over{ color:var(--danger); font-weight:600; }
.preview-bar .btn{ margin-left:auto; }
.sheet-frame{ width:100%; overflow:hidden; }
.sheet-scaler{ transform-origin:top left; width:794px; }
.sheet-shadow{ box-shadow:0 1px 3px rgba(20,26,43,.12), 0 12px 32px rgba(20,26,43,.14); }

/* =========================================================
   REPORT A4 (794 x 1123 px @96dpi). Selalu putih, tidak ikut dark mode.
   --k = faktor skala otomatis agar konten muat 1 halaman.
   ========================================================= */
.page{
  --k:1; --kc:1;
  --navy-bar:#0B2160;
  width:794px; height:1123px; background:#fff; color:#000;
  padding:48px 80px 40px; display:flex; flex-direction:column;
  font-family:"Century Gothic", "Mulish", "Avenir", Arial, sans-serif;
  position:relative; overflow:hidden;
}
.page *{ box-sizing:border-box; }
.r-body{ flex:1; min-height:0; overflow:hidden; }
.r-logo img{ height:24px; display:block; }
.r-title{ text-align:center; font-family:Arial, Helvetica, sans-serif; font-weight:700; font-size:calc(13.5px * var(--k)); line-height:1.35; margin-top:calc(18px * var(--k)); }
.r-title .t2{ font-size:calc(14px * var(--k)); }
.r-info{ margin-top:calc(16px * var(--k)); border-collapse:collapse; font-weight:700; font-size:calc(13px * var(--k)); }
.r-info td{ padding:0 0 1px; vertical-align:top; line-height:1.3; }
.r-info td:first-child{ width:150px; white-space:nowrap; }
.r-legend{ margin-top:calc(14px * var(--k)); font-family:Arial, Helvetica, sans-serif; font-size:calc(9px * var(--k)); font-weight:700; }
.r-legend .lbl{ padding-left:10px; margin-bottom:3px; }
.r-legend .band{ background:#A6A6A6; display:flex; justify-content:center; gap:22px; padding:3px 0; }
.r-h{ margin-top:calc(14px * var(--k)); font-weight:700; text-decoration:underline; text-underline-offset:2px; font-size:calc(12.5px * var(--k)); }

.chart{ border:1px solid #D9D9D9; margin-top:calc(6px * var(--k)); padding:calc(8px * var(--kc)) 14px calc(6px * var(--kc)); font-family:Arial, Helvetica, sans-serif; }
.chart-title{ text-align:center; color:#595959; font-size:calc(16px * (0.5 + var(--kc) / 2)); margin-bottom:calc(6px * var(--kc)); }
.plot{ position:relative; height:calc(118px * var(--kc)); display:flex; align-items:flex-end; border-bottom:1px solid #D9D9D9; margin-right:34px; }
.slot{ flex:1; height:100%; display:flex; align-items:flex-end; justify-content:center; }
.bar{ width:72%; background:var(--navy-bar); position:relative; }
.bar span{ position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); text-align:center; color:#fff; font-weight:700; font-size:calc(8.5px * var(--k)); }
.avgline{ position:absolute; left:4%; right:-34px; height:0; border-top:2px solid #A6A6A6; }
.avgline span{ position:absolute; right:0; bottom:2px; font-weight:700; font-size:calc(8.5px * var(--k)); color:#000; }
.cats{ display:flex; margin-right:34px; margin-top:4px; }
.cats div{ flex:1; text-align:center; color:#595959; font-size:calc(7.5px * var(--k)); line-height:1.25; padding:0 4px; }
.r-avg{ text-align:center; font-weight:700; font-size:calc(9.5px * var(--k)); margin-top:calc(8px * var(--k)); }
.r-text{ font-size:calc(9.5px * var(--k)); line-height:1.4; margin-top:calc(5px * var(--k)); }
.r-text p{ margin:0; padding-left:8px; text-indent:-8px; }
.r-text .sublbl{ font-weight:700; font-style:italic; margin-top:calc(3px * var(--k)); padding-left:0; text-indent:0; }
.r-know-h{ font-weight:700; font-size:calc(9.5px * var(--k)); margin-top:calc(12px * var(--k)); }
.r-text.know{ margin-top:calc(8px * var(--k)); }
.r-placeholder{ color:#9A9A9A; font-style:italic; }
.r-foot{ flex:none; margin-top:10px; background:#A6A6A6; text-align:center; font-size:9px; padding:5px 10px; line-height:1.45; }
.r-foot b{ display:block; }
.r-empty{ display:flex; align-items:center; justify-content:center; height:100%; color:#999; font-size:15px; text-align:center; padding:40px; }

.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* ---------- Penyesuaian khusus report MILEA ---------- */
.meta-list{ margin-top:10px; font-size:13px; color:var(--muted); display:flex; flex-direction:column; gap:3px; }
.meta-list b{ color:var(--ink); font-weight:600; }
.ai-mode{ margin:0 0 10px; font-size:12.5px; color:var(--muted); }
.sec-tools{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:2px 0 6px; }
.sec-status{ font-size:12.5px; color:var(--muted); }
.r-legend{ font-family:"Century Gothic", "Mulish", Arial, sans-serif; }
.r-legend .lbl{ padding-left:0; font-size:calc(11px * var(--k)); margin-bottom:2px; }
.r-legend .band{ background:#000; color:#fff; font-weight:400; font-size:calc(10px * var(--k)); gap:28px; padding:4px 0; }
.r-h{ margin-top:calc(18px * var(--k)); font-size:calc(13px * var(--k)); }
.chart{ width:74%; margin-left:auto; margin-right:auto; margin-top:calc(8px * var(--k)); }
.chart-title{ font-size:calc(19px * (0.5 + var(--kc) / 2)); }
.r-avg{ font-size:calc(10.5px * var(--k)); margin-top:calc(12px * var(--k)); margin-bottom:calc(10px * var(--k)); }
.r-fb-h{ font-weight:700; font-size:calc(10.5px * var(--k)); margin-top:calc(8px * var(--k)); }
.r-fb{ margin:calc(4px * var(--k)) 0 0; padding-left:24px; font-size:calc(10.5px * var(--k)); line-height:1.45; }
.r-fb li{ margin-bottom:calc(4px * var(--k)); padding-left:4px; }
.r-foot{ background:#000; color:#fff; }
.r-info td:first-child{ width:172px; padding-right:10px; }
.plot{ position:relative; height:calc(128px * var(--kc)); margin-left:28px; margin-right:34px; }
.grid{ position:absolute; left:0; right:0; height:0; border-top:1px dashed #D9D9D9; }
.grid.max{ border-top:1.5px solid #7F7F7F; }
.grid span{ position:absolute; left:-28px; width:22px; top:calc(-5px * var(--k)); text-align:right; font-size:calc(7.5px * var(--k)); color:#7F7F7F; line-height:1; }
.grid.max span{ color:#000; font-weight:700; }
.bars{ position:absolute; inset:0; display:flex; border-bottom:1px solid #BFBFBF; }
.slot{ flex:1; height:100%; display:flex; justify-content:center; }
.track{ width:62%; height:100%; background:#C9D6EE; display:flex; flex-direction:column; justify-content:flex-end; }
.bars.few .track{ width:42%; }
.fill{ background:var(--navy-bar); position:relative; }
.fill span{ position:absolute; z-index:2; left:50%; transform:translateX(-50%); top:calc(5px * var(--k)); padding:1px 3px; background:var(--navy-bar); white-space:nowrap; color:#fff; font-weight:700; font-size:calc(8.5px * var(--k)); line-height:1; }
.fill.low span{ top:auto; bottom:100%; margin-bottom:2px; background:transparent; color:var(--navy-bar); }
.avgline{ position:absolute; z-index:1; left:0; right:-34px; height:0; border-top:2px solid #A6A6A6; }
.avgline span{ position:absolute; right:0; top:3px; font-weight:700; font-size:calc(8.5px * var(--k)); color:#000; line-height:1; }
.cats{ display:flex; margin-left:28px; margin-right:34px; margin-top:4px; }
.cats div{ flex:1; text-align:center; color:#595959; font-size:calc(7.5px * var(--k)); line-height:1.25; padding:0 4px; }
.legend{ display:flex; justify-content:center; gap:16px; font-size:calc(7.5px * var(--k)); color:#595959; margin-top:calc(5px * var(--kc)); }
.legend i{ display:inline-block; width:8px; height:8px; margin-right:4px; vertical-align:-1px; }

/* Ukuran grafik MILEA (2 grafik, lebih besar) */
.plot{ height:calc(165px * var(--kc)); }
.fill span, .avgline span{ font-size:calc(10px * var(--k)); }
.grid span{ font-size:calc(8.5px * var(--k)); }
.cats div{ font-size:calc(8.5px * var(--k)); }
.legend{ font-size:calc(8.5px * var(--k)); }
.bars.few .track{ width:42%; }

</style>
</head>
<body>

<header class="app-head">
  <div>
    <h1>Report Evaluasi Pembelajaran MILEA</h1>
    <p>Unggah data survei MILEA, lengkapi keterangan, susun feedback, lalu unduh PDF satu halaman.</p>
  </div>
</header>

<main class="layout">
  <section class="steps" aria-label="Langkah penyusunan report">

    <!-- STEP 1 -->
    <div class="step" id="step1">
      <div class="step-head"><div class="step-num">1</div><h2>Data survei MILEA</h2></div>
      <div class="step-body">
        <label class="drop" id="drop">
          <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
          <strong>Pilih file Excel</strong>
          <span>atau tarik file ke sini (.xlsx hasil ekspor survei MILEA)</span>
        </label>
        <div id="fileInfo" class="file-info" hidden></div>
      </div>
    </div>

    <!-- STEP 2 -->
    <div class="step" id="step2">
      <div class="step-head"><div class="step-num">2</div><h2>Keterangan pelatihan</h2></div>
      <div class="step-body">
        <div class="field">
          <label for="fProgram">Program</label>
          <input type="text" id="fProgram" placeholder="Nama Program">
        </div>
        <div class="field">
          <label for="fJudul">Materi</label>
          <input type="text" id="fJudul" placeholder="Nama Materi">
        </div>
        <div class="field">
          <label for="fTanggal">Hari, tanggal (periode) <span class="sub">— pilih dari kalender atau ketik sendiri</span></label>
          <div class="date-row">
            <input type="text" id="fTanggal" placeholder="Hari, Tanggal (periode)">
            <input type="date" id="fDatePick" aria-label="Pilih tanggal dari kalender" title="Pilih dari kalender">
          </div>
        </div>
        <div class="field">
          <label for="fDurasi">Durasi</label>
          <input type="text" id="fDurasi" placeholder="Durasi">
        </div>
        <div class="field">
          <label for="fTrainer">Fasilitator</label>
          <input type="text" id="fTrainer" placeholder="Nama Fasilitator">
        </div>
        <div class="field">
          <label for="fCoord">Training Coordinator</label>
          <input type="text" id="fCoord" placeholder="Nama Training Coordinator">
        </div>
      </div>
    </div>

    <!-- STEP 3 -->
    <div class="step locked" id="step3">
      <div class="step-head"><div class="step-num">3</div><h2>Feedback / masukan</h2><span class="hint">satu poin per baris</span></div>
      <div class="step-body">
        <p class="ai-mode" id="aiMode">Memeriksa ketersediaan ringkasan AI…</p>
        <div id="sumEditors"></div>
      </div>
    </div>

  </section>

  <section class="preview-col" aria-label="Pratinjau report">
    <div class="preview-bar">
      <span class="fit" id="fitStatus">Pratinjau A4</span>
      <button class="btn" id="btnPDF" type="button" disabled>Unduh PDF</button>
    </div>
    <div class="sheet-frame" id="sheetFrame">
      <div class="sheet-scaler" id="sheetScaler">
        <div class="sheet-shadow"><div class="page" id="page"></div></div>
      </div>
    </div>
  </section>
</main>

<script>
/* =========================================================
   KONFIGURASI
   aiEndpoint: Vercel Function yang meneruskan permintaan ke GitHub Models.
   Bila endpoint tidak tersedia, tombol AI disembunyikan dan Rapikan tetap bisa dipakai.
   ========================================================= */

/* Pengelompokan pertanyaan survei MILEA (dicocokkan dengan teks kolom "question") */
const SECTIONS = [
  { key:"A", title:"A. Aplikasi", items:[
      { q:"aplikasi milea mudah digunakan", label:"Aplikasi MILEA mudah digunakan" },
      { q:"pembelajaran lebih efektif dan efisien", label:"Pembelajaran lebih efektif dan efisien" }
  ]},
  { key:"B", title:"B. Pengelolaan Pembelajaran", items:[
      { q:"memfasilitasi proses pembelajaran peserta", label:"Memfasilitasi proses pembelajaran peserta" },
      { q:"merespon pertanyaan dengan cepat dan tepat", label:"Merespon pertanyaan dengan cepat dan tepat." }
  ]}
];
const FEEDBACK_Q = /^masukan/;
const LIKERT = { "sangat tidak setuju":1, "tidak setuju":2, "netral":3, "setuju":4, "sangat setuju":5 };

const HARI = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const BULAN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

const state = { data:null, aiAvailable:false, feedback:"" };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const norm = (s) => String(s ?? "").replace(/\u00a0/g," ").replace(/\s+/g," ").trim().toLowerCase();
const qkey = (s) => norm(s).replace(/[\s.:!?]+$/, "");

/* Pembulatan setengah ke atas, aman dari galat floating point */
function round2(x){ return Math.round(Number((x * 100).toFixed(6))) / 100; }
function fmt2(x){ return round2(x).toFixed(2); }

function toDate(v){
  if (v instanceof Date && !isNaN(v)) return v;
  if (typeof v === "number") { const d = XLSX.SSF.parse_date_code(v); return d ? new Date(d.y, d.m - 1, d.d, d.H, d.M, d.S) : null; }
  const d = new Date(String(v || "")); return isNaN(d) ? null : d;
}
function fmtRange(a, b){
  if (!a || !b) return "";
  const da = a.getDate(), db = b.getDate(), ma = a.getMonth(), mb = b.getMonth(), ya = a.getFullYear(), yb = b.getFullYear();
  if (ya === yb && ma === mb) return da === db ? da + " " + BULAN[ma] + " " + ya : da + "–" + db + " " + BULAN[ma] + " " + ya;
  if (ya === yb) return da + " " + BULAN[ma] + " – " + db + " " + BULAN[mb] + " " + ya;
  return da + " " + BULAN[ma] + " " + ya + " – " + db + " " + BULAN[mb] + " " + yb;
}

/* =========================================================
   PARSING EXCEL (format memanjang: satu baris per pertanyaan)
   ========================================================= */
function parseWorkbook(buf){
  const wb = XLSX.read(buf, { type:"array", cellDates:true });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:null, raw:true, blankrows:false });
  if (!rows.length) throw new Error("Sheet pertama kosong.");

  const header = (rows[0] || []).map(norm);
  const col = (name) => header.indexOf(name);
  const C = { email:col("email"), date:col("created_date"), survey:col("survey_title"), q:col("question"), ans:col("answer"), pt:col("point") };
  if (C.q < 0 || C.ans < 0 || C.pt < 0) {
    throw new Error("Kolom question, answer, dan point tidak ditemukan. Pastikan file yang diunggah adalah hasil ekspor survei MILEA.");
  }

  const itemMap = new Map();
  SECTIONS.forEach(s => s.items.forEach(it => itemMap.set(it.q, { ...it, vals:[], mismatch:0, sample:null })));
  const comments = [], unknown = new Set(), submissions = new Set(), emails = new Set(), surveys = new Set();
  let dMin = null, dMax = null, invalid = 0;

  for (let i = 1; i < rows.length; i++){
    const r = rows[i] || [];
    const q = qkey(r[C.q]);
    if (!q) continue;
    const email = C.email >= 0 ? norm(r[C.email]) : "";
    const d = C.date >= 0 ? toDate(r[C.date]) : null;
    submissions.add(email + "|" + (d ? d.getTime() : i));
    if (email) emails.add(email);
    if (C.survey >= 0 && r[C.survey]) surveys.add(String(r[C.survey]).trim());
    if (d) { if (!dMin || d < dMin) dMin = d; if (!dMax || d > dMax) dMax = d; }

    if (FEEDBACK_Q.test(q)) {
      const t = String(r[C.ans] ?? "").trim();
      if (t) comments.push(t);
      continue;
    }
    const it = itemMap.get(q);
    if (!it) { unknown.add(String(r[C.q]).trim()); continue; }
    const p = Number(r[C.pt]);
    if (!Number.isFinite(p) || p < 1 || p > 5) { invalid++; continue; }
    it.vals.push(p);
    const expected = LIKERT[norm(r[C.ans])];
    if (expected !== undefined && expected !== p) { it.mismatch++; if (!it.sample) it.sample = String(r[C.ans]).trim() + " = " + p; }
  }

  const warnings = [];
  const results = SECTIONS.map(s => {
    const items = s.items.map(x => {
      const it = itemMap.get(x.q);
      const avg = it.vals.length ? round2(it.vals.reduce((a,b) => a + b, 0) / it.vals.length) : 0;
      if (!it.vals.length) warnings.push('Pertanyaan "' + x.label + '" tidak ditemukan di data.');
      if (it.mismatch) warnings.push('Pertanyaan "' + x.label + '": ' + it.mismatch + ' jawaban memiliki label yang tidak sesuai dengan point (contoh: ' + it.sample + '). Perhitungan tetap memakai kolom point.');
      return { label:x.label, avg, n:it.vals.length };
    });
    // Rata-rata kelompok = rata-rata dari nilai item yang sudah dibulatkan
    const groupAvg = round2(items.reduce((a,b) => a + b.avg, 0) / items.length);
    return { key:s.key, title:s.title, items, groupAvg };
  });
  if (results.every(r => r.items.every(i => !i.n))) throw new Error("Tidak ada pertanyaan survei MILEA yang dikenali di file ini.");
  if (unknown.size) warnings.push("Pertanyaan tidak dikenal dan diabaikan: " + [...unknown].join("; "));
  if (invalid) warnings.push(invalid + " nilai di luar rentang 1–5 diabaikan.");

  return { submissions:submissions.size, participants:emails.size, surveys:[...surveys], range:fmtRange(dMin, dMax), results, comments, warnings };
}

const fileInput = $("fileInput"), drop = $("drop");
fileInput.addEventListener("change", e => { if (e.target.files[0]) handleFile(e.target.files[0]); });
["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("drag"); }));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("drag"); }));
drop.addEventListener("drop", e => { const f = e.dataTransfer.files[0]; if (f) handleFile(f); });

async function handleFile(file){
  const info = $("fileInfo");
  info.hidden = false;
  try {
    if (typeof XLSX === "undefined") throw new Error("Pustaka pembaca Excel gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.");
    const data = parseWorkbook(await file.arrayBuffer());
    state.data = data;
    state.feedback = "";
    info.innerHTML =
      '<div class="fname">' + esc(file.name) + '</div>' +
      '<div class="stats">' +
        '<span class="chip">' + data.submissions + ' respons</span>' +
        (data.participants ? '<span class="chip">' + data.participants + ' peserta</span>' : '') +
        (data.surveys.length ? '<span class="chip">' + data.surveys.length + ' materi</span>' : '') +
        '<span class="chip">' + data.comments.filter(c => !/^(-+|—+|\.+|tidak ada|belum ada|none)$/i.test(c.trim())).length + ' masukan terisi</span>' +
      '</div>' +
      (data.surveys.length || data.range ? '<div class="meta-list">' +
        (data.range ? '<div><b>Periode pengisian:</b> ' + esc(data.range) + '</div>' : '') +
        (data.surveys.length ? '<div><b>Materi:</b> ' + data.surveys.map(esc).join(", ") + '</div>' : '') +
      '</div>' : '') +
      data.warnings.map(w => '<div class="notice warn">' + esc(w) + '</div>').join("");
    $("step3").classList.remove("locked");
    $("btnPDF").disabled = false;
    buildEditor();
    render();
  } catch (err) {
    state.data = null;
    info.innerHTML = '<div class="fname">' + esc(file.name) + '</div><div class="notice err">' + esc(err.message || err) + '</div>';
    $("step3").classList.add("locked");
    $("btnPDF").disabled = true;
    $("sumEditors").innerHTML = "";
    render();
  } finally {
    fileInput.value = "";
  }
}

function uniqueComments(list){
  const map = new Map();
  list.forEach(c => { const k = norm(c); if (!k) return; map.set(k, { text:c.trim(), n:(map.get(k)?.n || 0) + 1 }); });
  return [...map.values()];
}
const TRIVIAL = /^(ok(e|ay)?|oke+|good|all good|so far so good|nice|bagus|baik|mantap|sip|(sudah )?(cukup )?(sangat )?(bagus|baik|oke|ok|jelas)( sekali| bgt| banget)?|sangat bagus|cukup|tidak ada|belum ada|nihil|none|-+|—+|\.+)[.!\s]*$/i;
const PRAISE = /(bagus|baik|jelas|mudah|memudahkan|runtut|membantu|menarik|bermanfaat|paham|good|mantap)/i;
const ISSUE = /(terlalu|kurang|tidak (terdengar|jelas|sesuai|bisa|muncul|lengkap)|belum|salah|error|lambat|lemot|loading|sulit|susah|bingung|kencang|keras|pelan|seharusnya|gangguan|komplit)/i;
const SUGGEST = /\b(lebih|tambah|tambahkan|penambahan|ditambah|mohon|sebaiknya|perlu|agar|supaya|update|diperbarui|harap|saran|semoga)\b/i;
const THEMES = [/suara|musik|audio|vo\b|narasi|volume|background/i, /pertanyaan|kuis|quiz|jawaban|soal|evaluasi/i, /materi|konten|video|modul/i, /aplikasi|login|loading|akses|fitur/i];
const themeOf = (t) => { const i = THEMES.findIndex(re => re.test(t)); return i < 0 ? THEMES.length : i; };
const ABBR = {
  lbh:"lebih", utk:"untuk", untk:"untuk", org:"orang", yg:"yang", dgn:"dengan", dg:"dengan", krn:"karena", karna:"karena",
  tdk:"tidak", gak:"tidak", ga:"tidak", nggak:"tidak", sdh:"sudah", udah:"sudah", blm:"belum", jg:"juga", dr:"dari",
  pd:"pada", spy:"supaya", tsb:"tersebut", kpd:"kepada", bs:"bisa", tp:"tetapi", msh:"masih", bgt:"sekali", banget:"sekali",
  dlm:"dalam", thd:"terhadap", vo:"VO", latat:"latar"
};
function tidyText(s){
  let t = String(s).replace(/\s+/g, " ").trim();
  t = t.replace(/[A-Za-z]+/g, w => ABBR[w.toLowerCase()] ?? w);
  t = t.replace(/^(bahwa|yaitu|yakni)\s+/i, "");
  t = t.replace(/\bdi ([a-z]+kan)\b/gi, "di$1");
  t = t.replace(/\s*,\s*/g, ", ").replace(/\s+([.!?])/g, "$1");
  t = t.charAt(0).toUpperCase() + t.slice(1);
  if (!/[.!?]$/.test(t)) t += ".";
  return t;
}
function rawList(list){
  const u = uniqueComments(list);
  if (!u.length) return '<p style="color:var(--muted);margin:6px 0 0">Tidak ada masukan.</p>';
  return '<ul>' + u.map(c => '<li>' + esc(c.text) + (c.n > 1 ? ' <b>(' + c.n + '×)</b>' : '') + '</li>').join("") + '</ul>';
}
function autosize(t){ t.style.height = "auto"; t.style.height = (t.scrollHeight + 2) + "px"; }
function setFeedback(v){ state.feedback = v; const ta = $("fb"); if (ta) { ta.value = v; autosize(ta); } render(); }

function buildEditor(){
  const d = state.data; if (!d) return;
  $("sumEditors").innerHTML =
    '<div class="field"><label for="fb">Poin feedback <span class="sub">— nomor ditambahkan otomatis di report</span></label>' +
      '<textarea id="fb" rows="5"></textarea></div>' +
    '<div class="sec-tools">' +
      '<button type="button" class="btn ghost small" id="btnTidy" title="Tanpa AI: ambil komentar berisi masalah/saran, rapikan singkatan dan tanda baca">Rapikan</button>' +
      (state.aiAvailable ? '<button type="button" class="btn ghost small" id="btnAI">Ringkas dengan AI</button>' : '') +
      '<button type="button" class="btn ghost small" id="btnCopy">Salin mentah</button>' +
      '<span class="sec-status" id="stfb"></span>' +
    '</div>' +
    '<details class="raw"><summary>Lihat ' + d.comments.length + ' masukan peserta</summary>' + rawList(d.comments) + '</details>';
  const ta = $("fb");
  ta.value = state.feedback; autosize(ta);
  ta.addEventListener("input", () => { autosize(ta); state.feedback = ta.value; render(); });
  $("btnTidy").addEventListener("click", tidyFeedback);
  $("btnCopy").addEventListener("click", copyRaw);
  if (state.aiAvailable) $("btnAI").addEventListener("click", aiFeedback);
}

function copyRaw(){
  const lines = uniqueComments(state.data.comments).map(c => c.text).filter(t => !TRIVIAL.test(t));
  if (!lines.length) { $("stfb").textContent = "Tidak ada masukan yang bisa disalin."; return; }
  setFeedback((state.feedback.trim() ? state.feedback.trim() + "\n" : "") + lines.join("\n"));
  $("stfb").textContent = lines.length + " masukan disalin.";
}

/* Rapikan tanpa AI: hanya komentar berisi masalah/saran, pujian & komentar umum dibuang */
function tidyFeedback(){
  if (state.feedback.trim() && !confirm("Isi feedback akan diganti dengan hasil rapikan. Lanjutkan?")) return;
  const seen = new Set(), keep = [];
  let skipped = 0;
  uniqueComments(state.data.comments).sort((a,b) => b.n - a.n).forEach(c => {
    if (TRIVIAL.test(c.text)) { skipped++; return; }
    const isIssue = ISSUE.test(c.text) || SUGGEST.test(c.text);
    if (!isIssue) { skipped++; return; }
    const t = tidyText(c.text);
    const k = norm(t).replace(/[.!?]$/, "");
    if (seen.has(k)) return;
    seen.add(k); keep.push(t);
  });
  keep.sort((a,b) => themeOf(a) - themeOf(b));
  setFeedback(keep.join("\n"));
  $("stfb").textContent = keep.length + " masukan dirapikan tanpa AI; " + skipped + " komentar pujian/umum tidak dimasukkan. Sunting kalimatnya bila perlu.";
}

/* Ringkas dengan AI lewat /api/summarize */
async function aiFeedback(){
  if (state.feedback.trim() && !confirm("Isi feedback akan diganti dengan rangkuman AI. Lanjutkan?")) return;
  const btn = $("btnAI"), st = $("stfb");
  btn.disabled = true;
  btn.innerHTML = '<span class="spin" aria-hidden="true"></span> Meringkas…';
  st.textContent = "Biasanya 10–20 detik.";
  try {
    const d = state.data;
    const payload = {
      mode:"milea",
      title:[$("fProgram").value.trim(), $("fJudul").value.trim()].filter(Boolean).join(" - "),
      items: d.results.flatMap(r => r.items.map(i => ({ group:r.title, label:i.label, avg:i.avg }))),
      comments: uniqueComments(d.comments).filter(c => !TRIVIAL.test(c.text)).map(c => c.text + (c.n > 1 ? " (" + c.n + " orang)" : ""))
    };
    let res;
    try { res = await fetch(CONFIG.aiEndpoint, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(payload) }); }
    catch (e) { throw new Error("tidak dapat menghubungi server"); }
    let json = {};
    try { json = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error((json.error || ("server merespons status " + res.status)) + (json.detail ? " — " + json.detail : ""));
    const lines = (Array.isArray(json.masukan) ? json.masukan : []).map(s => String(s).replace(/^\s*[-•*\d.)]+\s*/, "").trim()).filter(Boolean);
    setFeedback(lines.join("\n"));
    st.textContent = "Rangkuman AI siap. Tambahkan atau sunting poin bila perlu.";
  } catch (err) {
    console.error(err);
    st.textContent = "Gagal meringkas: " + (err.message || err) + ". Gunakan Rapikan.";
  } finally {
    btn.disabled = false;
    btn.textContent = "Ringkas dengan AI";
  }
}

/* =========================================================
   RENDER REPORT
   ========================================================= */
const bullets = (text) => String(text || "").split("\n").map(s => s.replace(/^\s*([-•*]|\d+[.)])\s*/, "").trim()).filter(Boolean);

function chartHTML(r, withLegend){
  // Skala tetap 3–5 (garis tiap 0.5) agar tinggi batang konsisten antar report.
  // Biru tua = nilai aktual, biru muda = sisa menuju nilai maksimal 5.
  // Nilai di bawah 3.00 tidak punya batang; angkanya tetap tampil di dasar grafik.
  const Y_MIN = 3, Y_MAX = 5;
  const pct = (v) => (Math.max(Y_MIN, Math.min(Y_MAX, v)) - Y_MIN) / (Y_MAX - Y_MIN) * 100;
  let grid = "", bars = "", cats = "";
  for (let v = Y_MIN; v <= Y_MAX + 1e-9; v += 0.5) {
    grid += '<div class="grid' + (Math.abs(v - Y_MAX) < 1e-9 ? ' max' : '') + '" style="bottom:' + pct(v) + '%"><span>' + v.toFixed(1) + '</span></div>';
  }
  r.items.forEach(i => {
    const h = pct(i.avg);
    bars += '<div class="slot"><div class="track"><div class="fill' + (h < 14 ? ' low' : '') + '" style="height:' + h.toFixed(2) + '%"><span>' + fmt2(i.avg) + '</span></div></div></div>';
    cats += '<div>' + esc(i.label) + '</div>';
  });
  return '<div class="chart">' +
    '<div class="chart-title">' + esc(r.title) + '</div>' +
    '<div class="plot">' + grid +
      '<div class="bars' + (r.items.length <= 2 ? ' few' : '') + '">' + bars + '</div>' +
      '<div class="avgline" style="bottom:' + pct(r.groupAvg).toFixed(2) + '%"><span>' + fmt2(r.groupAvg) + '</span></div>' +
    '</div>' +
    '<div class="cats">' + cats + '</div>' +
    (withLegend ? '<div class="legend"><span><i style="background:#0B2160"></i>Nilai aktual</span><span><i style="background:#C9D6EE"></i>Sisa menuju 5.00</span></div>' : '') +
  '</div>';
}

function render(){
  const page = $("page"), d = state.data;
  const val = (id) => { const v = $(id).value.trim(); return v ? esc(v) : '<span class="r-placeholder">…</span>'; };

  let html = '<div class="r-body"><div class="r-content" id="rContent">' +
    '<div class="r-logo"><img src="' + CONFIG.logo + '" alt="MDS Retailing"></div>' +
    '<div class="r-title"><div>EVALUASI PELATIHAN</div></div>' +
    '<table class="r-info">' +
      '<tr><td>Program</td><td>: ' + val("fProgram") + '</td></tr>' +
      '<tr><td>Materi</td><td>: ' + val("fJudul") + '</td></tr>' +
      '<tr><td>Hari, Tanggal (periode)</td><td>: ' + val("fTanggal") + '</td></tr>' +
      '<tr><td>Durasi</td><td>: ' + val("fDurasi") + '</td></tr>' +
      '<tr><td>Fasilitator</td><td>: ' + val("fTrainer") + '</td></tr>' +
      '<tr><td>Training Coordinator</td><td>: ' + val("fCoord") + '</td></tr>' +
    '</table>' +
    '<div class="r-legend"><div class="lbl">Arti Nilai Yang Diperoleh:</div>' +
      '<div class="band"><span>1 = Kurang Sekali</span><span>2 = Kurang</span><span>3 = Cukup</span><span>4 = Baik</span><span>5 = Baik Sekali</span></div></div>' +
    '<div class="r-h">ASPEK YANG DINILAI</div>';

  if (!d) {
    html += '<div class="r-empty" style="height:480px">Grafik dan feedback akan muncul setelah data survei diunggah.</div>';
  } else {
    d.results.forEach((r, idx) => {
      html += chartHTML(r, idx === d.results.length - 1) + '<div class="r-avg">Nilai Rata-rata ' + r.key + ' = ' + fmt2(r.groupAvg) + '</div>';
    });
    const fb = bullets(state.feedback);
    html += '<div class="r-fb-h">Feedback/masukan:</div><ol class="r-fb">' +
      (fb.length ? fb.map(s => '<li>' + esc(s) + '</li>').join("") : '<li class="r-placeholder">(feedback belum diisi)</li>') + '</ol>';
  }
  html += '</div></div><div class="r-foot"><b>HR-Learning &amp; Development Department</b></div>';
  page.innerHTML = html;
  fitToPage();
}

/* Kecilkan grafik dulu, lalu teks, hingga konten muat 1 halaman */
function fitToPage(){
  const page = $("page"), content = $("rContent"), body = page.querySelector(".r-body");
  let kc = 1, k = 1;
  page.style.setProperty("--kc", kc); page.style.setProperty("--k", k);
  while (content.scrollHeight > body.clientHeight && kc > 0.6) { kc = Math.round((kc - 0.04) * 100) / 100; page.style.setProperty("--kc", kc); }
  while (content.scrollHeight > body.clientHeight && k > 0.78) { k = Math.round((k - 0.02) * 100) / 100; page.style.setProperty("--k", k); }
  const over = content.scrollHeight > body.clientHeight;
  const st = $("fitStatus");
  st.classList.toggle("over", over);
  st.textContent = over ? "Konten melebihi 1 halaman — ringkas beberapa poin."
    : k < 1 ? "Muat 1 halaman (ukuran teks disesuaikan " + Math.round(k*100) + "%)"
    : kc < 1 ? "Muat 1 halaman (tinggi grafik disesuaikan)" : "Muat 1 halaman A4";
  return !over;
}

/* =========================================================
   PRATINJAU & EKSPOR PDF
   ========================================================= */
function scalePreview(){
  const frame = $("sheetFrame"), scaler = $("sheetScaler");
  const s = Math.min(1, frame.clientWidth / 794);
  scaler.style.transform = "scale(" + s + ")";
  frame.style.height = (1123 * s) + "px";
}
new ResizeObserver(scalePreview).observe($("sheetFrame"));

$("btnPDF").addEventListener("click", async () => {
  const btn = $("btnPDF");
  if (!fitToPage() && !confirm("Konten masih melebihi 1 halaman dan bagian bawah akan terpotong. Tetap unduh?")) return;
  if (state.data && !bullets(state.feedback).length && !confirm("Feedback/masukan belum diisi dan akan dikosongkan di PDF. Tetap unduh?")) return;
  if (typeof html2canvas === "undefined" || !window.jspdf) { alert("Pustaka PDF gagal dimuat. Periksa koneksi internet lalu muat ulang halaman."); return; }
  btn.disabled = true;
  btn.innerHTML = '<span class="spin" aria-hidden="true"></span> Menyiapkan PDF…';
  let holder;
  try {
    await document.fonts.ready;
    holder = document.createElement("div");
    holder.style.cssText = "position:absolute;left:-10000px;top:0;width:794px;";
    const clone = $("page").cloneNode(true);
    clone.removeAttribute("id");
    clone.querySelectorAll("[id]").forEach(el => el.removeAttribute("id"));
    clone.querySelectorAll(".r-fb .r-placeholder").forEach(el => el.remove());
    holder.appendChild(clone);
    document.body.appendChild(holder);
    const canvas = await html2canvas(clone, { scale:3, backgroundColor:"#ffffff", useCORS:true, logging:false, width:794, height:1123, windowWidth:1400 });
    const pdf = new window.jspdf.jsPDF({ unit:"mm", format:"a4", orientation:"portrait", compress:true });
    pdf.addImage(canvas.toDataURL("image/jpeg", 0.95), "JPEG", 0, 0, 210, 297);
    const name = ([$("fProgram").value.trim(), $("fJudul").value.trim()].filter(Boolean).join(" ") || "MILEA")
      .replace(/[\\/:*?"<>|,]+/g, "").replace(/\s+/g, "_").slice(0, 80);
    pdf.save("Evaluasi_" + name + ".pdf");
  } catch (err) {
    console.error(err);
    alert("PDF gagal dibuat: " + (err.message || err));
  } finally {
    if (holder) holder.remove();
    btn.disabled = !state.data;
    btn.textContent = "Unduh PDF";
  }
});

/* Cek apakah endpoint AI aktif (token terpasang di server) */
async function detectAI(){
  state.aiAvailable = false;
  if (location.protocol !== "file:") {
    try { const res = await fetch(CONFIG.aiEndpoint, { method:"GET" }); const j = res.ok ? await res.json() : {}; state.aiAvailable = !!j.configured; } catch (e) {}
  }
  $("aiMode").textContent = state.aiAvailable
    ? "Ringkasan AI aktif. Tombol Rapikan tetap tersedia tanpa AI."
    : "Ringkasan AI tidak aktif di sini. Tombol Rapikan bekerja tanpa AI.";
  if (state.data) buildEditor();
}

render();
scalePreview();
detectAI();
</script>
